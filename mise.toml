# The mise route to Sidereal's pinned tools. mise.lock pins each exact
# release; CONTRIBUTING.md says how to use and update them.

[tools]
# The channel, not a release: rustup decides the release, and
# server/rust-toolchain.toml must name the same channel.
rust = { version = "stable", components = "rustfmt,clippy" }
# No node entry: mise reads .nvmrc, so the version lives in one file.
pnpm = "12"
gh = "2"
# Pinned on its own until a Let's Spec release names OpenSpec 2. Until
# then, don't take this version from the Let's Spec release notes.
"github:Fission-AI/OpenSpec" = "2.1.1"
"github:sidereal-io/lets-spec" = "0.8.0"

[env]
LETS_SPEC_FLOW = "standard"
# Keeps the OpenSpec CLI offline, as the Nix shell does.
OPENSPEC_NO_UPDATE_CHECK = "1"

[hooks]
enter = "lets sync"

[settings]
# Off by default; set here so .nvmrc applies whatever a contributor's
# global config says.
idiomatic_version_file_enable_tools = ["node"]

# The gate. Up to about six lines inline; a longer body goes in a POSIX sh
# script under scripts/ or server/scripts/.
[tasks.check-compose]
description = "Compose configuration checks (Compose CLI and jq; no daemon)"
run = "sh scripts/compose-config-check.sh"

[tasks.check-openspec]
description = "OpenSpec checks: strict validation of every spec and active change; warnings fail it"
run = "OPENSPEC_TELEMETRY=0 openspec validate --all --strict --no-interactive"

[tasks.check-server]
description = "Server checks: format, clippy (warnings denied), tests, dependency-direction lint"
run = "(cd server && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test) && server/scripts/check-arch.sh"

[tasks.check-web]
description = "Web checks: install from the lockfile, then types, lint, format, DESIGN.md lint, token drift, unit tests"
run = "(cd web && pnpm install --frozen-lockfile --reporter=append-only && pnpm typecheck && pnpm lint && pnpm format:check && pnpm design:lint && pnpm tokens:check && pnpm test)"

# A run list, not depends: mise starts dependencies in parallel, and the
# gate must run its parts in order and stop at the first failure.
[tasks.check]
description = "The gate to pass before every pull request"
run = [
  { task = "check-compose" },
  { task = "check-openspec" },
  { task = "check-server" },
  { task = "check-web" },
]

# Development tasks. Each body is one command that runs without mise, so
# CONTRIBUTING.md can list it for contributors on the hand-install route.

[tasks.db-up]
description = "Start this worktree's loopback PostgreSQL fixture and wait for initialization"
run = "sh server/scripts/db-fixture.sh up"

[tasks.db-down]
description = "Stop this worktree's database fixture, retaining its volume"
run = "sh server/scripts/db-fixture.sh down"

[tasks.db-clean]
description = "Delete only this worktree's fixture containers and database volume"
run = "sh server/scripts/db-fixture.sh clean"

# quiet: the URL is then the only output on either stream.
[tasks.db-url]
description = "Print the fixture runtime URL; override SIDEREAL_DB_PORT if needed"
run = "sh server/scripts/db-fixture.sh url"
quiet = true

[tasks.db-test-url]
description = "Print the separate CREATEDB fixture test URL"
run = "sh server/scripts/db-fixture.sh test-url"
quiet = true

[tasks.db-test-clean]
description = "Remove killed-test leftovers only from this worktree's fixture"
run = "sh server/scripts/db-fixture.sh orphan-clean"

# raw: Vite and the server see the terminal, and mise adds nothing to
# their output.
[tasks.server]
description = "Run the server against DATABASE_URL (GET /healthz and /readyz)"
run = "sh scripts/dev.sh server"
raw = true

[tasks.web]
description = "Run the web shell only; installs from web/pnpm-lock.yaml first"
run = "sh scripts/dev.sh web"
raw = true

# mise's own parallel run keeps one task going when the other exits with
# status 0, so the script supervises both itself.
[tasks.dev]
description = "Run the server and web shell together; Ctrl-C stops both"
run = "sh scripts/dev.sh"
raw = true

[tasks.e2e]
description = "Run the Playwright end-to-end suite; the database fixture must be up"
run = "sh scripts/e2e.sh"

[tasks.db-schema]
description = "Regenerate normalized schema descriptions using the pinned fixture"
run = "sh server/scripts/db-schema.sh"

[tasks.db-tls]
description = "Generate local fixture certificates without requiring Docker"
run = "sh server/scripts/db-tls.sh"

# Needs Docker, and takes minutes, so `mise run check` does not run it.
[tasks.instance-verify]
description = "Build the app image, start a disposable Compose instance, check it, and remove it"
run = "sh scripts/instance-verify.sh"

[tasks.external-db-verify]
description = "Check TLS startup and recreation against a separate disposable PostgreSQL service"
run = "sh scripts/external-db-verify.sh"
