schema: spec-driven-review

context: |
  The backlog is GitHub issues, each with its MoSCoW priority; openspec/discovery.md
  holds personas and journeys. An issue marked "Not yet a story" must be cut into a
  story packet before it is proposed. When asked to propose the next change without
  a specific request, list open issues with
  `gh issue list --state open --limit 200 --json number,title,labels,assignees,blockedBy,subIssuesSummary`.
  Skip epic parents (any issue labeled `epic` or with sub-issues), issues with an
  open blocker, and assigned issues (they are in progress). Take the lowest number
  and read its story packet with `gh issue view <n> --json body`. When proposing,
  assign the issue (`gh issue edit <n> --add-assignee @me`) and have the draft PR
  say `Closes #<n>`. One story per change.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
