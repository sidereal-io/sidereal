schema: spec-driven-review

context: |
  The backlog is GitHub issues, each with its MoSCoW priority as a `priority/*` label;
  openspec/discovery.md holds personas and journeys. An issue marked "Not yet a story"
  must be cut into a story packet before it is proposed. When asked to propose the
  next change without a specific request, list open issues with
  `gh issue list --state open --limit 200 --json number,title,labels,assignees,blockedBy,parent,subIssuesSummary`.
  Skip epic parents (any issue labeled `kind/epic` or with sub-issues), issues with an
  open blocker, assigned issues (they are in progress), issues labeled `priority/wont`,
  and issues with no `priority/*` label (they are untriaged). For each candidate,
  follow its native parent links with `gh issue view <n> --json parent,blockedBy`.
  Exclude it if any ancestor has an open blocker; continue to the next candidate.
  AGENTS.md's "Epic planning and issue relationships" section defines the shared
  planning rules. Epics omit relevant-code sections and repeated workflow rules;
  identify groundwork and relevant code during exploration and story cutting.
  Of the eligible stories, take the
  highest priority — `priority/must`, then `priority/should`, then `priority/could` —
  and the lowest number within it. Read its story packet with
  `gh issue view <n> --json body`. When proposing,
  assign the issue (`gh issue edit <n> --add-assignee @me`) and have the draft PR
  say `Closes #<n>`. One story per change.

  v2 UI work in `web/` follows DESIGN.md at the repo root (ADR-005): it is the source
  of truth for every token value and usage rule, and code and Penpot follow it.

rules:
  design:
    - For UI work in `web/`, list every semantic or component token the change adds,
      each with one line on why no existing token fits. Write "none" if it adds none.
  tasks:
    - When a change adds or changes a token, include tasks to edit DESIGN.md first,
      regenerate the token files, and import the token JSON into Penpot after merge.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
