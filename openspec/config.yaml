schema: lets-standard

context: |
  Sidereal is a self-hosted photo gallery for astrophotographers: a Rust server
  (axum, cargo workspace in server/) and a React 19 + Vite + TypeScript web
  interface (pnpm, in web/) on PostgreSQL. AGENTS.md holds the durable constraints:
  the one-way dependency direction between plugin-abi, core, packs/astro and server;
  domain logic in packs, never in core; PostgreSQL only; and `just check` as the gate.

  openspec/discovery.md holds personas and journeys. UI work in `web/` follows
  DESIGN.md at the repo root (ADR-005): it is the source of truth for every token
  value and usage rule, and code and Penpot follow it.

rules:
  design:
    - For UI work in `web/`, list every semantic or component token the change adds,
      each with one line on why no existing token fits. Write "none" if it adds none.
  tasks:
    - When a change adds or changes a token, include tasks to edit DESIGN.md first,
      then regenerate tokens.css with `pnpm tokens` in web/.

# The code review rule. lets-spec put it here, and this project owns it:
# delete it to stop code reviews, or edit it to change when they run.
# OpenSpec keeps a project's rules for finishing a change under
# operations.archive. lets-build follows them once every task is done,
# before it runs verify.
operations:
  archive:
    guidance:
      - >-
        Every change gets one code review before it is verified. If the
        pull request description has no **Code review** section, run the
        `lets-review-code` skill now. Otherwise check the section as that
        skill's *Check an earlier review* section says, and run the skill
        again only when it tells you to.
