name: mise tool updates

# Dependabot does not read mise.toml, so this workflow moves the mise pins
# once a week and opens one pull request with the result. A scheduled run
# uses main; a manual run uses the branch picked in the Actions tab, so the
# update job refuses every branch but main.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# A manual run and a scheduled run must not push to the branch at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The default token only reads. The App token in the publish job is the one
# writer, and it does not ask for workflows: write, so this branch cannot
# change a workflow file.
permissions:
  contents: read

jobs:
  # Runs newly released tools, so it holds no secret and hands on only a
  # patch, which the publish job treats as untrusted data.
  update:
    runs-on: ubuntu-latest
    # Installing Rust takes a few minutes; a stuck download must not hold
    # the concurrency group.
    timeout-minutes: 30
    steps:
      - name: Refuse a run from another branch
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::This workflow runs only from main. This run started from $GITHUB_REF, so it changed nothing. Start it again from main."
            exit 1
          fi

      # github.sha is the main commit this run started from; publish checks
      # out the same one, so the patch applies there.
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # mise upgrade moves installed tools only, so install every tool first.
      # --locked fails on a stale lock. No cache: a restored install skips
      # the checksum check.
      - name: Install tools from mise.lock
        uses: jdx/mise-action@v5
        with:
          install_args: --locked
          cache: false

      # The script holds the update steps, so a contributor can run the same
      # ones by hand. The read-only token raises GitHub's API rate limit.
      - name: Update the mise tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/update-mise-tools.sh

      # No renames: the publish job refuses them, so each path is plain.
      # The patch is empty when nothing changed.
      - name: Save the changes as a patch
        run: |
          git add -A
          git diff --cached --binary --no-renames > "$RUNNER_TEMP/mise-tool-update.patch"

      - name: Upload the patch
        uses: actions/upload-artifact@v7
        with:
          name: mise-tool-update
          path: ${{ runner.temp }}/mise-tool-update.patch
          if-no-files-found: error
          retention-days: 1

  # A fresh runner that installs and runs none of the updated tools. Only
  # this job holds the App key. It reads nothing from the update job but the
  # patch, and checks every path in it before it creates the token.
  publish:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Outside the work tree, so the patch is never part of the commit.
      - name: Download the patch
        uses: actions/download-artifact@v8
        with:
          name: mise-tool-update
          path: ${{ runner.temp }}/mise-tool-update

      - name: Apply the patch if it changes only allowed files
        run: scripts/apply-mise-tool-update.sh "$RUNNER_TEMP/mise-tool-update/mise-tool-update.patch"

      # Created after the check, so a refused patch never meets a write
      # token. A push made with the default token would start no CI.
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DEPENDABOT_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # One fixed branch keeps one pull request open: a later run updates it.
      # A clean working tree opens nothing. Every input is fixed here, so the
      # update job shapes only the diff.
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/mise-tool-updates
          base: main
          delete-branch: true
          title: 'chore: update mise tools'
          commit-message: 'chore: update mise tools'
          body: |
            The weekly `mise tool updates` workflow moved the mise tool pins:
            Node, pnpm and `gh` within the ranges in `.nvmrc` and `mise.toml`,
            and Let's Spec to its newest release, with the files `lets sync`
            writes for it. The diff shows what moved.

            The workflow does not run the gate. CI runs it on this pull
            request; a failing check means an update broke something.

            The workflow rewrites the `automation/mise-tool-updates` branch
            each week, so a commit pushed to it by hand is lost. To fix an
            update, push to another branch.
