name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

# Read metadata with the default token. Only the final job uses App credentials.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    if: >-
      github.repository == 'sidereal-io/sidereal' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.policy.outputs.eligible }}
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - name: Read verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@ffa630c65fa7e0ecfa0625b5ceda64399aea1b36 # v3.0.0
        with:
          github-token: ${{ github.token }}

      - name: Require every dependency to be a patch or minor update
        id: policy
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          eligible=$(jq -r 'length > 0 and all(.[];
            .updateType == "version-update:semver-patch" or
            .updateType == "version-update:semver-minor")' <<< "$DEPENDENCIES")
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

  automerge:
    needs: metadata
    if: needs.metadata.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.DEPENDABOT_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$PR_HEAD_SHA"
