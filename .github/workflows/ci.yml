name: ci

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'web/**'
      - 'DESIGN.md'
      - 'justfile'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
      - 'DESIGN.md'
      - 'justfile'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cmd-format: nix develop -c {0}

      - name: Server gate
        run: nix develop --command just check-server

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Web gate
        run: nix develop --command just check-web
