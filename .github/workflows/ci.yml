name: CI Pipeline

on:
  push:
    branches:
      - v0.x
  pull_request:
    branches:
      - v0.x

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run type checking
        run: npm run check

      - name: Run unit tests
        run: npm run test

      - name: Test security workflow reporting and digest selection
        run: node --test --test-isolation=none tools/scripts/security-workflows.test.mjs

      - name: Build all packages
        run: npm run build

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: v0.x/codeql/javascript-typescript
