name: ci

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'web/**'
      - 'DESIGN.md'
      - 'justfile'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - '.github/workflows/ci.yml'
      - '.github/ci-paths.yml'
  pull_request:

# A newer commit supersedes checks for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: paths
        with:
          filters: .github/ci-paths.yml

  server:
    needs: paths
    if: needs.paths.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cmd-format: nix develop -c {0}

      - name: Prepare PostgreSQL fixture
        run: |
          nix develop --command just db-up
          test_url=$(nix develop --command just db-test-url)
          echo "::add-mask::$test_url"
          printf 'TEST_DATABASE_URL=%s\n' "$test_url" >> "$GITHUB_ENV"

      - name: Server gate
        run: nix develop --command just check-server

      - name: Stop PostgreSQL fixture
        if: always()
        run: nix develop --command just db-down

  web:
    needs: paths
    if: needs.paths.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Web gate
        run: nix develop --command just check-web

  result:
    name: CI
    needs: [paths, server, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required job outcomes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success" or .result == "skipped")
            and .paths.result == "success"
            and (.paths.outputs.server != "true" or .server.result == "success")
            and (.paths.outputs.web != "true" or .web.result == "success")' <<< "$RESULTS"
