name: ci

on:
  push:
    branches:
      - main
  pull_request:

# A newer commit supersedes checks for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # --locked fails on a stale lock, where a plain install would resolve
      # a fresh release.
      - name: Install tools from mise.lock
        uses: jdx/mise-action@v5
        with:
          install_args: --locked

      # Docker and jq come from the runner.
      - name: Compose configuration checks (no daemon required)
        run: mise run check-compose

  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools from mise.lock
        uses: jdx/mise-action@v5
        with:
          install_args: --locked

      # Runs after the install: it calls cargo and rustc to build its key,
      # and must use mise's Rust.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cmd-format: mise exec -- {0}

      - name: Prepare PostgreSQL fixture
        run: |
          mise run db-up
          test_url=$(mise run db-test-url)
          echo "::add-mask::$test_url"
          printf 'TEST_DATABASE_URL=%s\n' "$test_url" >> "$GITHUB_ENV"

      - name: Server gate
        run: mise run check-server

      - name: Stop PostgreSQL fixture
        if: always()
        run: mise run db-down

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools from mise.lock
        uses: jdx/mise-action@v5
        with:
          install_args: --locked

      - name: Web gate
        run: mise run check-web

  openspec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools from mise.lock
        uses: jdx/mise-action@v5
        with:
          install_args: --locked

      - name: OpenSpec gate
        run: mise run check-openspec

  # End-to-end gate. Kept out of `check` because it boots the server and a
  # browser, so it runs on its own runner instead of competing with the
  # unit jobs for CPU.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools from mise.lock
        uses: jdx/mise-action@v5
        with:
          install_args: --locked

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cmd-format: mise exec -- {0}

      - name: Prepare PostgreSQL fixture
        run: |
          mise run db-up
          db_url=$(mise run db-url)
          echo "::add-mask::$db_url"
          printf 'DATABASE_URL=%s\n' "$db_url" >> "$GITHUB_ENV"

      # `cargo run` inside Playwright's webServer block would compile here,
      # within the 300s startup timeout. Build first so a cold cache cannot
      # spend that window on rustc.
      - name: Build the server
        run: mise exec -- cargo build -p sidereal-server --manifest-path server/Cargo.toml

      # A bare runner lacks the shared libraries Chromium links against.
      # The `e2e` task installs the browser without touching the system, so the
      # package set is installed here where root is available.
      - name: Install Chromium and its system libraries
        working-directory: web
        run: |
          mise exec -- pnpm install --frozen-lockfile --reporter=append-only
          mise exec -- pnpm exec playwright install --with-deps chromium

      - name: End-to-end gate
        run: mise run e2e

      - name: Stop PostgreSQL fixture
        if: always()
        run: mise run db-down

      # The HTML report carries the failure screenshot, diff and console log,
      # which is the whole reason to bother uploading it.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # The skills, schemas and rules block that lets sync writes must match the
  # release mise.toml names. mise exec runs no enter hook, so nothing syncs
  # the files before the check compares them.
  lets-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools from mise.lock
        uses: jdx/mise-action@v5
        with:
          install_args: --locked

      - name: Check the Let's Spec files
        run: mise exec -- lets sync --check
