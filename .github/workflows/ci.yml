name: ci

on:
  push:
    branches:
      - main
  pull_request:

# A newer commit supersedes checks for the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          cmd-format: nix develop -c {0}

      - name: Prepare PostgreSQL fixture
        run: |
          nix develop --command just db-up
          test_url=$(nix develop --command just db-test-url)
          echo "::add-mask::$test_url"
          printf 'TEST_DATABASE_URL=%s\n' "$test_url" >> "$GITHUB_ENV"

      - name: Server gate
        run: nix develop --command just check-server

      - name: Stop PostgreSQL fixture
        if: always()
        run: nix develop --command just db-down

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Web gate
        run: nix develop --command just check-web
