name: CI Pipeline

on:
  push:
    branches:
      - main
      - v0.x
    paths-ignore:
      - 'server/**'
      - 'web/**'
      - 'openspec/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - v0.x
    paths-ignore:
      - 'server/**'
      - 'web/**'
      - 'openspec/**'
      - 'docs/**'

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run type checking
        run: npm run check

      - name: Run unit tests
        run: npm run test

      - name: Run server tests
        run: npm run test:server

      - name: Build all packages
        run: npm run build
