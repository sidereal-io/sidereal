name: mise

on:
  pull_request:
    paths:
      - 'mise.toml'
      - 'mise.lock'
      - 'server/rust-toolchain.toml'
      - '.nvmrc'
      - '.github/workflows/mise.yml'

# A newer commit supersedes checks for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mise-check:
    name: mise check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # --locked fails on a stale lock or a wrong checksum, where a plain
      # install would resolve a fresh release. No cache: a restored install
      # skips the checksum check.
      - name: Install tools from mise.lock
        uses: jdx/mise-action@v5
        with:
          install_args: --locked
          cache: false

      # Each route reads its own file, so the two must name one channel.
      - name: Rust channels agree
        run: |
          mise_channel=$(mise config get tools.rust.version)
          file_channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' server/rust-toolchain.toml)
          if [ "$mise_channel" != "$file_channel" ]; then
            echo "::error::Rust channels differ: mise.toml names '$mise_channel', server/rust-toolchain.toml names '$file_channel'"
            exit 1
          fi

      - name: Tool versions
        run: mise exec -- sh -c 'rustc --version && node --version && pnpm --version && just --version && gh --version && openspec --version && lets --version'
