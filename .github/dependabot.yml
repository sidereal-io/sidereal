version: 2
updates:
  # GitHub reads this file from the default branch only, so the first three
  # entries send version updates for the v0.10.x app to the v0.x branch.
  # target-branch covers version updates only: Dependabot alerts and security
  # updates follow main. The weekly v0-security-scan.yml workflow covers v0.x.

  # v0.x: npm
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "v0.x"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    ignore:
      - dependency-name: "@types/node"
        versions: ["25.x"]
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
      types:
        patterns:
          - "@types/*"

  # v0.x: Docker
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "v0.x"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "node"
        versions: ["25.x"]
      - dependency-name: "@types/node"
        versions: ["25.x"]

  # v0.x: GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v0.x"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    labels:
      - "dependencies"
      - "github-actions"

  # main: GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    labels:
      - "dependencies"
      - "github-actions"

  # main: Nix flake inputs
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    groups:
      nix-inputs:
        patterns:
          - "*"

  # main: the Rust server
  - package-ecosystem: "cargo"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    groups:
      cargo-crates:
        patterns:
          - "*"

  # main: the web shell
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
      types:
        patterns:
          - "@types/*"
