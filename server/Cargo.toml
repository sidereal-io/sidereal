# Sidereal server — cargo workspace.
# Crate seams mirror the architecture (see docs/architecture.md and ADR-002):
#   plugin-abi  — public contracts a third-party pack would also code against
#   core        — domain-agnostic engine, built on plugin-abi
#   packs/astro — first-party pack; depends on plugin-abi ONLY, never core internals
#                 (enforced by scripts/check-arch.sh)
#   packs/image — first-party pack for PNG/JPEG; the same rule applies
#   server      — thin axum binary that wires core + packs
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/plugin-abi",
    "crates/server",
    "crates/packs/astro",
    "crates/packs/image",
]
# A broken workspace that check-arch.sh must refuse.
exclude = ["tests/fixtures/arch-violation"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared dependencies, referenced by member crates via `{ workspace = true }`.
[workspace.dependencies]
# Internal crates.
sidereal-core = { path = "crates/core" }
sidereal-plugin-abi = { path = "crates/plugin-abi" }
sidereal-pack-astro = { path = "crates/packs/astro" }
sidereal-pack-image = { path = "crates/packs/image" }

# External crates.
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid", "json"] }
rustls = { version = "0.23", default-features = false }
url = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "limit"] }
# Decodes a request path as the file service does, to guard asset page addresses.
percent-encoding = "2"
# The error type the transport limit raises, so upload can tell it apart.
http-body-util = "0.1"
argon2 = "0.6"
base64ct = { version = "1", features = ["alloc"] }
rand = "0.10"
sha2 = "0.11"
# Content addresses for stored objects (ADR-011).
blake3 = "1"
# Test client for the events socket; the same library axum's `ws` feature uses.
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Image header decoders for the image pack: the ones the `image` crate uses,
# called directly, so a header run reads no pixel data.
png = "0.18"
zune-jpeg = "0.5"
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
tiff = { version = "0.11", default-features = false, features = ["lzw", "deflate"] }
# Compress test TIFFs; `tiff` decodes with the same two.
weezl = "0.1"
flate2 = "1"
linked_list_allocator = { version = "0.10", default-features = false }

# Lighter debug information for development and test builds, to keep each
# worktree's target/ small. Our own crates keep line tables, so panic
# backtraces still name files and lines; dependencies get none.
# CONTRIBUTING.md says how to turn full debug information back on.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
