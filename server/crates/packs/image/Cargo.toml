[package]
name = "sidereal-pack-image"
version.workspace = true
edition.workspace = true
license.workspace = true

# The image pack codes against the public contract ONLY. It must NOT depend on
# `sidereal-core`, the server or another pack; server/scripts/check-arch.sh
# enforces this (ADR-002).
[dependencies]
sidereal-plugin-abi = { workspace = true }
# Reads a PNG's header: its signature and IHDR chunk, and nothing after.
png = { workspace = true }
# Reads a JPEG's markers through its first start-of-scan segment.
zune-jpeg = { workspace = true }
# Writes each preview: a baseline JPEG, one row of blocks at a time.
jpeg-encoder = { workspace = true }
